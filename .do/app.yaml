# DigitalOcean App Platform (optional — you can also set these in the DO UI)
name: erp-platform
region: nyc

services:
  - name: api
    source_dir: /
    github:
      repo: YOUR_GITHUB_USER/YOUR_REPO
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    instance_size_slug: basic-xxs
    http_port: 4000
    build_command: npm install && npx prisma generate --schema apps/api/prisma/schema.prisma && npm run build -w @erp/api
    run_command: node apps/api/dist/index.js
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      # Public app URL used for Stripe redirects and password reset emails
      - key: PUBLIC_APP_URL
        scope: RUN_AND_BUILD_TIME
        value: https://YOUR-APP-DOMAIN.ondigitalocean.app
      # Stripe (leave unset to disable paid checkout — free plans still work)
      - key: STRIPE_SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      # Transactional email (Resend) for reminders & password resets
      - key: RESEND_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: PLATFORM_EMAIL_FROM
        scope: RUN_AND_BUILD_TIME
        value: ERP Platform <noreply@yourdomain.com>
      # Bootstraps a platform admin during first seed
      - key: SEED_PLATFORM_ADMIN_EMAIL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: SEED_PLATFORM_ADMIN_PASSWORD
        scope: RUN_AND_BUILD_TIME
        type: SECRET

static_sites:
  - name: web
    source_dir: /
    github:
      repo: YOUR_GITHUB_USER/YOUR_REPO
      branch: main
      deploy_on_push: true
    build_command: npm install && npm run build -w @erp/web
    output_dir: apps/web/dist
    index_document: index.html
    catchall_document: index.html
