services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - erp_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: erp_analytics
      CLICKHOUSE_USER: erp
      CLICKHOUSE_PASSWORD: erp
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - erp_ch:/var/lib/clickhouse

volumes:
  erp_pg:
  erp_ch:
